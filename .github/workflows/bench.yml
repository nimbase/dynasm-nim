name: bench
on:
  push:
    paths:
      - 'examples/**'
      - 'bench/**'
      - 'src/**'
      - '.github/workflows/bench.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        default: 'release'
        type: choice
        options: [release, debug]
      examples:
        description: 'Space-separated example subset (empty = all)'
        default: ''
        required: false
      iters:
        description: 'BENCH_ITERS override (empty = per-example default)'
        default: ''
        required: false
jobs:
  bench:
    # Every example emits native code for its host (x64 on amd64,
    # AArch64 on arm64), so all runners execute the full bench
    # natively with no emulation.
    name: bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: amd64}
          - {os: windows-latest, arch: amd64}
          - {os: macos-15-intel, arch: amd64}
          - {os: macos-15, arch: arm64}
          - {os: ubuntu-24.04-arm, arch: arm64}
          - {os: windows-11-arm, arch: arm64}
    steps:
      - uses: actions/checkout@v4

      - uses: nimbase/setup-nim-action@main
        with:
          nim-version: stable

      # No clue binary ships for ARM Linux/Windows: those jobs use
      # the plain-nim fallback in bench.sh (examples need no deps).
      # macOS ARM has a native clue binary, so it installs normally.
      - name: Install clue
        if: matrix.os == 'macos-15' || matrix.arch != 'arm64'
        shell: bash
        run: |
          set -eu
          os="${{ runner.os }}"
          arch="${{ runner.arch }}"
          case "${os}" in
            Linux)
              asset="clue_linux-x86_64"; ext="tar.gz"
              ;;
            macOS)
              case "${arch}" in
                X64)   asset="clue_macos-x86_64"; ext="tar.gz" ;;
                ARM64) asset="clue_macos-arm64";  ext="tar.gz" ;;
                *)     echo "ERROR: unsupported macOS arch: ${arch}"; exit 1 ;;
              esac
              ;;
            Windows)
              asset="clue_windows-x86_64"; ext="zip"
              ;;
            *)
              echo "ERROR: unsupported os: ${os}"; exit 1
              ;;
          esac
          url="https://github.com/openpeeps/clue/releases/latest/download/${asset}.${ext}"
          echo ">> downloading ${url}"
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          curl -fsSL "${url}" -o "${work}/clue.${ext}"
          if [[ "${ext}" == "zip" ]]; then
            win_zip="$(cygpath -w "${work}/clue.zip")"
            win_dest="$(cygpath -w "${work}")"
            powershell -NoProfile -Command "Expand-Archive -Force -LiteralPath '${win_zip}' -DestinationPath '${win_dest}'"
          else
            tar xzf "${work}/clue.${ext}" -C "${work}"
          fi
          bin="$(find "${work}" -type f \( -name 'clue' -o -name 'clue.exe' \) | head -n 1)"
          [[ -n "${bin}" ]] || { echo "ERROR: clue binary not found in archive"; exit 1; }
          chmod +x "${bin}"
          mkdir -p "$HOME/.clue/bin"
          target="$HOME/.clue/bin/clue"
          if [[ "${os}" == "Windows" ]]; then
            target="${target}.exe"
          fi
          install -m 0755 "${bin}" "${target}"
          if [[ "${os}" == "Windows" ]]; then
            win_path="$(cygpath -w "$HOME/.clue/bin")"
            echo "$win_path" >> "$GITHUB_PATH"
          else
            echo "$HOME/.clue/bin" >> "$GITHUB_PATH"
          fi

      - name: Install dependencies
        if: matrix.os == 'macos-15' || matrix.arch != 'arm64'
        shell: bash
        run: clue install --depsOnly

      - name: Run benches
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          BENCH_ITERS: ${{ inputs.iters }}
        run: |
          if [[ -n "${{ inputs.examples }}" ]]; then
            # shellcheck disable=SC2086
            bash examples/bench.sh ${{ inputs.examples }}
          else
            bash examples/bench.sh
          fi

      - name: Print Markdown table
        shell: bash
        run: cat bench/results/SUMMARY.md

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench/results/
